<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
</head>
<body>
<div id="viewer" style="width:600px;height:400px;border:1px solid black;"></div>
<script>
fetch('http://localhost:8000/api/artifact?path=artifacts/query.pdb')
  .then(r => r.text())
  .then(pdb => {
    console.log('PDB length:', pdb.length, 'starts with:', pdb.slice(0,30));
    var viewer = $3Dmol.createViewer(document.getElementById('viewer'), {backgroundColor:'white'});
    viewer.addModel(pdb, 'pdb');
    viewer.setStyle({}, {cartoon:{colorscheme:{prop:'b',gradient:'roygb',min:0,max:100}}});
    viewer.zoomTo();
    viewer.render();
    console.log('Done rendering');
  }).catch(e => console.error('Error:', e));
</script>
</body>
</html>
