{{/*
Shared opaque secret for the gateway (and any future consumer).

Intentionally does NOT store SYNQLAB_DB_URL: the templated URL uses the
"$(POSTGRES_PASSWORD)" sentinel, which Kubernetes only expands inside a
container's `env:` block — not inside a Secret. The gateway Deployment
therefore injects SYNQLAB_DB_URL and POSTGRES_PASSWORD as sibling env
vars, and one-shot jobs (e.g. Alembic migrate in CI) must build the URL
themselves from the Bitnami `<fullname>-postgresql` secret.

Kept as a placeholder so future non-DB secrets can land here without
churning the Deployment's envFrom reference.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synqlab.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "synqlab.labels" . | nindent 4 }}
type: Opaque
stringData: {}
