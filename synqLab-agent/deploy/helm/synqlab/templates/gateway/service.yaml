apiVersion: v1
kind: Service
metadata:
  name: {{ include "synqlab.fullname" . }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "synqlab.labels" . | nindent 4 }}
    {{- include "synqlab.selectorLabels" (dict "component" "gateway" "root" .) | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ include "synqlab.fullname" . }}-gateway"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "synqlab.selectorLabels" (dict "component" "gateway" "root" .) | nindent 4 }}
