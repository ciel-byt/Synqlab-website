# MOLECULAR SIMULATION
# ═══════════════════════════════════════════════════════════════════════════════

  - id: gromacs
    name: GROMACS
    category: simulation
    status: planned
    adapter_type: workflow
    execution_mode: async
    description: >
      High-performance molecular dynamics simulation engine.
      Used for validating structural stability of top-k candidates.
    capabilities: [md_simulation, stability_validation]
    resource_profile: {compute: gpu, gpu_level: high, disk_gb: 0.5, ram_gb: 16}
    tags: [md, expensive]
    notes: >
      Run only on top-k candidates that survive all scoring gates.
      Provides RMSD and RMSF trajectories; outputs register in Knowledge Store.

  - id: openmm
    name: OpenMM
    category: simulation
    status: planned
    adapter_type: python
    execution_mode: async
    description: Python-native MD simulation. More hackable than GROMACS.
    capabilities: [md_simulation, custom_force_fields]
    resource_profile: {compute: gpu, gpu_level: high, disk_gb: 0.1, ram_gb: 8}
    tags: [md, programmable]

  - id: namd
